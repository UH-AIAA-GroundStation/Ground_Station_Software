<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teensy Sensor Data</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        rect{
            pointer-events: all;
            fill-opacity: 0;
            stroke-opacity: 0;
            z-index: 10;
        }

        .tooltip{
            position: absolute;
            padding: 10px;
            background-color: darkgray;
            color: black;
            border: 1px solid black;
            border-radius: 10px;
            display: none;
            opacity: .75;
        }
    </style>
</head>
<body>
    <h1>Teensy Data</h1>

    <div class = "btns">
        <button id="startbtn">Start Recording</button>
        <button id="resetbtn">Reset</button>
    </div>

    <div class="data-set" id="altcontainer">
        <h2 class="sensor-header">Alititude</h2>
    </div>
    <div class="data-set" id="tempcontainer">
        <h2 class="sensor-header">Temperature</h2>
    </div>
    <div class="data-set" id="gpscontainer">
        <h2 class="sensor-header">GPS</h2>
    </div>
     <script src="script.js" type="module"></script>
     
</body>
</html>
